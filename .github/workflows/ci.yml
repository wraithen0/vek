name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
          - os: ubuntu-22.04
            compiler: clang
          - os: macos-14
            compiler: clang
          - os: windows-2022
            compiler: msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang

      - name: Build and Test (Unix)
        if: runner.os != 'Windows'
        run: |
          make clean
          make all CC=${{ matrix.compiler }}

      - name: Benchmarks (Unix)
        if: runner.os != 'Windows'
        run: make bench

      - name: Build and Test (Windows)
        if: runner.os == 'Windows'
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c11 /W3 /O2 /Iinclude /c src\scalar\kernels.c /Fokernels.o
          cl /nologo /std:c11 /W3 /O2 /Iinclude /c src\dispatch.c /Fodispatch.o
          cl /nologo /std:c11 /W3 /O2 /Iinclude /arch:SSE2 /c src\x86\sse2.c /Fosse2.o
          cl /nologo /std:c11 /W3 /O2 /Iinclude /arch:AVX2 /c src\x86\avx2.c /Foavx2.o
          lib /nologo /OUT:libvek.lib kernels.o dispatch.o sse2.o avx2.o
          cl /nologo /std:c11 /W3 /O2 /Iinclude tests\test_kernels.c /Fetest_kernels.exe /link libvek.lib
          cl /nologo /std:c11 /W3 /O2 /Iinclude tests\test_backends.c /Fetest_backends.exe /link libvek.lib
          test_kernels.exe
          test_backends.exe
        shell: cmd

      - name: Benchmarks (Windows)
        if: runner.os == 'Windows'
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c11 /W3 /O2 /Iinclude bench\bench_kernels.c /Febench_kernels.exe /link libvek.lib
          bench_kernels.exe 5000
        shell: cmd

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release artifacts
        run: |
          make clean
          make lib
          make install DESTDIR=./install PREFIX=/usr/local

      - name: Create tarball
        run: |
          cd install
          tar -czf ../vek-${{ github.ref_name }}-linux-x86_64.tar.gz *
          cd ..
          sha256sum vek-${{ github.ref_name }}-linux-x86_64.tar.gz > SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vek-${{ github.ref_name }}-linux-x86_64.tar.gz
            SHA256SUMS.txt
