name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
          - os: ubuntu-22.04
            compiler: clang
          - os: macos-14
            compiler: clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang

      - name: Build and Test
        run: |
          make clean
          make all CC=${{ matrix.compiler }}

      - name: Benchmarks
        run: make bench

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release artifacts
        run: |
          make clean
          make lib
          make install DESTDIR=./install PREFIX=/usr/local

      - name: Create tarball
        run: |
          cd install
          tar -czf ../vek-${{ github.ref_name }}-linux-x86_64.tar.gz *
          cd ..
          sha256sum vek-${{ github.ref_name }}-linux-x86_64.tar.gz > SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vek-${{ github.ref_name }}-linux-x86_64.tar.gz
            SHA256SUMS.txt
